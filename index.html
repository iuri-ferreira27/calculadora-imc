<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de IMC</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f0e8;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b6560;
      --accent: #2d5a27;
      --accent-light: #e8f4e6;
      --border: #e0dbd3;
      --radius: 16px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2.4rem;
      letter-spacing: -0.5px;
      line-height: 1.1;
      color: var(--text);
    }

    .header p {
      margin-top: 0.5rem;
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 300;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 2rem;
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .input-group {
      position: relative;
      margin-bottom: 1.25rem;
    }

    input[type="number"] {
      width: 100%;
      padding: 0.85rem 3rem 0.85rem 1rem;
      font-size: 1.1rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      -moz-appearance: textfield;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

    input[type="number"]:focus { border-color: var(--accent); }

    .unit {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.85rem;
      color: var(--muted);
      pointer-events: none;
    }

    button {
      width: 100%;
      padding: 1rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 0.5rem;
    }

    button:hover { opacity: 0.88; }
    button:active { transform: scale(0.98); }

    .result-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 2rem;
      text-align: center;
      display: none;
      animation: fadeUp 0.4s ease;
    }

    .result-card.visible { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .imc-value {
      font-family: 'DM Serif Display', serif;
      font-size: 4.5rem;
      line-height: 1;
      margin-bottom: 0.25rem;
    }

    .imc-label {
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
    }

    .scale {
      display: flex;
      border-radius: 8px;
      overflow: hidden;
      height: 8px;
      margin-bottom: 0.75rem;
    }

    .scale div { flex: 1; }

    .marker-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .tip-box {
      background: var(--accent-light);
      border-radius: 10px;
      padding: 0.9rem 1.1rem;
      font-size: 0.9rem;
      color: var(--accent);
      line-height: 1.5;
    }

    .reset-btn {
      background: transparent;
      color: var(--muted);
      border: 1.5px solid var(--border);
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    .reset-btn:hover { background: var(--bg); opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Calculadora<br>de IMC</h1>
      <p>Índice de Massa Corporal</p>
    </div>

    <div class="card" id="form-card">
      <div class="input-group">
        <label for="peso">Peso</label>
        <input type="number" id="peso" placeholder="70" min="1" max="300" />
        <span class="unit">kg</span>
      </div>
      <div class="input-group">
        <label for="altura">Altura</label>
        <input type="number" id="altura" placeholder="175" min="50" max="250" />
        <span class="unit">cm</span>
      </div>
      <button onclick="calcular()">Calcular IMC</button>
    </div>

    <div class="result-card" id="result-card">
      <div class="imc-value" id="imc-valor">—</div>
      <div class="imc-label" id="imc-label">—</div>

      <div class="scale">
        <div style="background:#6db8f5"></div>
        <div style="background:#72c472"></div>
        <div style="background:#f5c842"></div>
        <div style="background:#f5a623"></div>
        <div style="background:#e84444"></div>
      </div>
      <div class="marker-row">
        <span>Abaixo</span>
        <span>Normal</span>
        <span>Sobrepeso</span>
        <span>Obesidade</span>
        <span>Grave</span>
      </div>

      <div class="tip-box" id="imc-tip"></div>
      <button class="reset-btn" onclick="resetar()">Calcular novamente</button>
    </div>
  </div>

  <script>
    const categorias = [
      { max: 18.5, label: 'Abaixo do peso',  cor: '#6db8f5', tip: 'Seu IMC indica que você pode estar abaixo do peso ideal. Considere consultar um nutricionista.' },
      { max: 25,   label: 'Peso normal',      cor: '#72c472', tip: 'Parabéns! Seu IMC está na faixa considerada saudável. Continue mantendo hábitos equilibrados.' },
      { max: 30,   label: 'Sobrepeso',        cor: '#f5c842', tip: 'Seu IMC indica sobrepeso. Pequenas mudanças na alimentação e exercícios podem ajudar.' },
      { max: 35,   label: 'Obesidade grau I', cor: '#f5a623', tip: 'Recomendamos buscar orientação médica e nutricional para adotar um plano de saúde adequado.' },
      { max: Infinity, label: 'Obesidade grau II+', cor: '#e84444', tip: 'É importante consultar um médico. Cuidar da saúde agora faz grande diferença no futuro.' },
    ];

    function calcular() {
      const peso = parseFloat(document.getElementById('peso').value);
      const altCm = parseFloat(document.getElementById('altura').value);

      if (!peso || !altCm || peso <= 0 || altCm <= 0) {
        alert('Por favor, preencha peso e altura corretamente.');
        return;
      }

      const altM = altCm / 100;
      const imc = peso / (altM * altM);
      const cat = categorias.find(c => imc < c.max);

      document.getElementById('imc-valor').textContent = imc.toFixed(1);
      document.getElementById('imc-valor').style.color = cat.cor;
      document.getElementById('imc-label').textContent = cat.label;
      document.getElementById('imc-label').style.color = cat.cor;
      document.getElementById('imc-tip').textContent = cat.tip;

      document.getElementById('form-card').style.display = 'none';
      document.getElementById('result-card').classList.add('visible');
    }

    function resetar() {
      document.getElementById('peso').value = '';
      document.getElementById('altura').value = '';
      document.getElementById('result-card').classList.remove('visible');
      document.getElementById('form-card').style.display = 'block';
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') calcular(); });
  </script>
</body>
</html>
